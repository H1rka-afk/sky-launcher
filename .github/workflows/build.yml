name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Если проект загружен архивом — распаковываем
      - name: Unzip project
        run: |
          if [ -f SkyLauncher.zip ]; then unzip -o -q SkyLauncher.zip; fi
          if [ -d SkyLauncher ]; then echo "DIR=SkyLauncher" >> $GITHUB_ENV; else echo "DIR=." >> $GITHUB_ENV; fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build
        working-directory: ${{ env.DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp "${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk" SkyLauncher.apk

      # Публикуем в релиз "latest" — получаем прямую ссылку для Downloader на ТВ
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Sky Launcher
          files: SkyLauncher.apk
          make_latest: true
