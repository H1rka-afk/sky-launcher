name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Если проект загружен архивом — распаковываем
      - name: Unzip project
        run: |
          if [ -f SkyLauncher.zip ]; then unzip -o -q SkyLauncher.zip; fi
          if [ -d SkyLauncher ]; then echo "DIR=SkyLauncher" >> $GITHUB_ENV; else echo "DIR=." >> $GITHUB_ENV; fi

      - name: Nature wallpapers (Unsplash)
        working-directory: ${{ env.DIR }}
        run: bash scripts/fetch_wallpapers.sh

      - name: Save wallpapers to repo
        working-directory: ${{ env.DIR }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add app/src/main/res/drawable-nodpi
          git diff --cached --quiet || (git commit -m "Add nature wallpapers [skip ci]" && git push)

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build
        working-directory: ${{ env.DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Screenshots
        continue-on-error: true
        working-directory: ${{ env.DIR }}
        run: gradle testDebugUnitTest --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            ${{ env.DIR }}/app/build/shots/
            ${{ env.DIR }}/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Rename APK
        run: cp "${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk" SkyLauncher.apk

      # Публикуем в релиз "latest" — получаем прямую ссылку для Downloader на ТВ
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Sky OS
          files: SkyLauncher.apk
          make_latest: true

      # Скриншоты интерфейса — отдельным релизом (для проверки дизайна)
      - uses: softprops/action-gh-release@v2
        if: always()
        continue-on-error: true
        with:
          tag_name: screenshots
          name: Screenshots
          prerelease: true
          make_latest: false
          files: ${{ env.DIR }}/app/build/shots/*.png
