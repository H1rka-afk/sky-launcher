name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Если проект загружен архивом — распаковываем
      - name: Unzip project
        run: |
          if [ -f SkyLauncher.zip ]; then unzip -o -q SkyLauncher.zip; fi
          if [ -d SkyLauncher ]; then echo "DIR=SkyLauncher" >> $GITHUB_ENV; else echo "DIR=." >> $GITHUB_ENV; fi

      - name: Nature wallpapers (Unsplash)
        working-directory: ${{ env.DIR }}
        run: python3 scripts/fetch_wallpapers.py

      - name: Save wallpapers to repo
        working-directory: ${{ env.DIR }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add app/src/main/assets
          git diff --cached --quiet || (git commit -m "Add wallpapers [skip ci]" && git push)

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build
        working-directory: ${{ env.DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Screenshots
        id: shots
        continue-on-error: true
        working-directory: ${{ env.DIR }}
        run: gradle testDebugUnitTest --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            ${{ env.DIR }}/app/build/shots/
            ${{ env.DIR }}/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Rename APK + version.json
        if: steps.shots.outcome == 'success'
        run: |
          cp "${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk" SkyLauncher.apk
          NOTES="$(git log -1 --pretty=%s)"
          python3 - "$NOTES" <<'PY'
          import json, os, sys
          run = int(os.environ["GITHUB_RUN_NUMBER"])
          json.dump({"code": 100 + run, "name": f"3.1.{run}", "notes": sys.argv[1],
                     "url": "https://github.com/H1rka-afk/sky-launcher/releases/download/latest/SkyLauncher.apk"},
                    open("version.json", "w"), ensure_ascii=False)
          PY
          cat version.json

      # Публикуем в релиз "latest" — получаем прямую ссылку для Downloader на ТВ
      - uses: softprops/action-gh-release@v2
        if: steps.shots.outcome == 'success'   # не публикуем APK, если тесты упали
        with:
          tag_name: latest
          name: Sky OS
          files: |
            SkyLauncher.apk
            version.json
          make_latest: true

      # Скриншоты интерфейса — отдельным релизом (для проверки дизайна)
      - uses: softprops/action-gh-release@v2
        if: always()
        continue-on-error: true
        with:
          tag_name: screenshots
          name: Screenshots
          prerelease: true
          make_latest: false
          files: ${{ env.DIR }}/app/build/shots/*.png
